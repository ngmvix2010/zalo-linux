name: Build Zalo for Arch Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      zalo_version:
        description: 'Zalo version (empty = latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Initialize GPG Keyring & Install System Deps
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git nodejs npm p7zip 7zip \
            cmake meson ninja pkgconf libtool autoconf automake gettext nasm \
            patchelf clang wget unzip python python-pillow rust openssl sqlcipher xz

      - name: Create non-root user for makepkg
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - uses: actions/checkout@v4
        with:
          path: 'zalo-linux'

      - name: Fix permissions for builder user
        # Cấp quyền cho builder mà không đổi owner thư mục hệ thống của runner
        run: |
          chown -R builder:builder zalo-linux
          chmod -R 777 /__w/_temp/

      - name: Run makepkg
        id: build
        run: |
          su builder -c "
            cd zalo-linux
            makepkg -sf --noconfirm
          "
          
          PKG_FILE=$(ls zalo-linux/*.pkg.tar.zst | head -n 1)
          PKG_NAME=$(basename "$PKG_FILE")
          
          echo "pkg_file=$PKG_FILE" >> $GITHUB_OUTPUT
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.pkg_name }}
          path: ${{ steps.build.outputs.pkg_file }}
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.build.outputs.pkg_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
